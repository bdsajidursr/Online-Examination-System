<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manage Exams</title>

<style>
body { margin:0; font-family:Segoe UI; background:#f4f7fb; }
.container { display:flex; padding:0 20px 20px; gap:20px; }

.left, .right {
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.left { width:25%; }
.right { flex:1; }

.btn { padding:8px 14px; border:none; border-radius:6px; cursor:pointer; }
.green { background:#22c55e; color:white; }
.blue { background:#3b82f6; color:white; }
.input { width:100%; padding:8px; margin-bottom:10px; }

.q-card {
    padding:10px;
    margin-bottom:8px;
    background:#f1f5f9;
    border-radius:6px;
}
.exam-list {
    margin-top:15px;
}
.exam-item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    background:#e2e8f0;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.exam-item:hover {
    background:#cbd5f5;
}

.exam-item.active {
    background:#3b82f6;
    color:white;
}
.del-btn {
    background:#ef4444;
    color:white;
    border:none;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    float:right;
}

.del-btn:hover {
    background:#dc2626;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.05);
}

.card-header {
    margin-bottom: 20px;
}

.card h3 {
    margin-bottom: 15px;
    color: #334155;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.grid div {
    display: flex;
    flex-direction: column;
}

label {
    font-size: 13px;
    margin-bottom: 5px;
    color: #64748b;
}

.input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    transition: 0.2s;
}

.input:focus {
    border-color: #3b82f6;
    outline: none;
}

.primary-btn {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    width: 100%;
    margin-top: 10px;
}

.primary-btn:hover {
    opacity: 0.9;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    background: #22c55e;
    color: white;
    font-weight: bold;
    border-radius: 10px;
}
.exam-title {
    display: block;
    width: 96%;

    padding: 12px 18px;

    font-size: 20px;
    font-weight: 600;

    color: #1e293b;

    background: linear-gradient(90deg, #e0edff, #f8fafc);

    border-left: 5px solid #3b82f6;   /* 🔥 highlight line */

    border-radius: 8px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.title-bar {
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: 600;
    color: white;
    background: #4a69bd;   /* 🔵 BLUE */
    margin: 20px;
}
</style>
</head>

<body>
   <div class="title-bar">📋 Manage Exams</div>

<div class="container">

<!-- LEFT -->
<div class="left">
    <h3>Exams</h3>
    <button class="btn green" onclick="createExam()">+ Create Exam</button>
<div id="examList" class="exam-list"></div>
</div>

<!-- RIGHT -->
<div class="right">

  <div class="card-header">
    <div id="examTitle" class="exam-title">No Exam Selected</div>
</div>

    <!-- SCHEDULE CARD -->
    <div id="scheduleBox" class="card" style="display:none;">
        <h3>📅 Exam Schedule</h3>

        <div class="grid">
            <div>
                <label>Start Time</label>
                <input type="datetime-local" id="startTime" class="input">
            </div>

            <div>
                <label>End Time</label>
                <input type="datetime-local" id="endTime" class="input">
            </div>

            <div>
                <label>Duration (minutes)</label>
                <input type="number" id="duration" class="input">
            </div>
        </div>
    </div>

    <!-- QUESTION CARD -->
    <div id="questionBox" class="card" style="display:none;">

        <h3 id="qLabel">Question 1</h3>

        <select id="qType" class="input" onchange="toggleType()">
            <option value="mcq">MCQ</option>
            <option value="general">General</option>
        </select>

        <input id="qText" class="input" placeholder="Enter question...">

        <div id="mcqOptions">
            <input id="a" class="input" placeholder="Option A">
            <input id="b" class="input" placeholder="Option B">
            <input id="c" class="input" placeholder="Option C">
            <input id="d" class="input" placeholder="Option D">

            <select id="correct" class="input">
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
            </select>
        </div>

        <input id="generalAns" class="input" placeholder="Correct Answer" style="display:none;">

        <button class="btn primary-btn" onclick="addQuestion()">Add Question</button>

    </div>

    <!-- QUESTION LIST -->
<div class="card" id="questionListBox" style="display:none;">
    <h3>📋 Added Questions</h3>
    <div id="questionList"></div>
</div>

<div id="submitBox" style="display:none;">
    <button class="btn submit-btn" onclick="submitExam()">Submit Exam</button>
</div>

</div> <!-- RIGHT END -->
</div> <!-- CONTAINER END -->

    <!-- QUESTION CREATION -->

<script>
let exams = [];
let questions = [];
let currentExam = "";
let qCount = 1;
let editingId = null;

async function createExam(){
    const names = prompt("Enter exam names (comma separated):");
    if(!names) return;

    const list = names.split(',').map(n => n.trim()).filter(n => n);

    for(const name of list){
        await fetch('/api/create-exam', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ subject: name })
        });
    }

    loadExams(); // reload from DB
}

function renderExams(){
    const box = document.getElementById('examList');
    box.innerHTML = '';

    exams.forEach(obj => {
        const e = obj.name;
        const count = obj.count;

        const isActive = (e === currentExam) ? "active" : "";

        box.innerHTML += `
        <div class="exam-item ${isActive}" onclick="selectExam('${e}')">
            <div>
                📘 ${e}
                <small style="display:block;color:gray;">${count} Questions</small>
            </div>
            <button class="del-btn" onclick="deleteExam(event, '${e}')">✖</button>
        </div>`;
    });
}
async function loadExams(){
    const res = await fetch('/api/get-exams');
    const data = await res.json();

    exams = data.map(e => ({
        name: e.subject,
        count: e.qCount
    }));

    renderExams();
}

async function deleteExam(event, name){
    event.stopPropagation();

    if(!confirm("Delete this exam permanently?")) return;

    const res = await fetch('/api/delete-exam', {
        method: 'DELETE',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ subject: name })
    });

    const data = await res.json();

    if(data.success){
        alert("Deleted successfully");
        loadExams();
    } else {
        alert("Delete failed");
    }
}
async function loadQuestions(subject){
    const res = await fetch(`/api/get-questions?subject=${subject}`);
    const data = await res.json();

    questions = data;

    const list = document.getElementById('questionList');
    list.innerHTML = '';

    let count = 1;

    data.forEach((q, i) => {
       list.innerHTML += `
<div class="q-card">
    Question ${count}: ${q.question_text}

    <div style="float:right;">
       <button onclick="editSavedQuestionByIndex(${i})">Edit</button>
        <button onclick="deleteQuestion(${q.id})" style="background:red;color:white;margin-left:5px;">Delete</button>
    </div>

</div>`;
        count++;
    });

    qCount = count;
    document.getElementById('qLabel').innerText = "Question " + qCount;
}
function editSavedQuestionByIndex(index){
    const q = questions[index];
    editSavedQuestion(q);
}

function selectExam(name){
    currentExam = name;
    qCount = 1;

    document.getElementById('examTitle').innerText = "📘 " + name;
    document.getElementById('scheduleBox').style.display='block';
    document.getElementById('questionBox').style.display='block';
    document.getElementById('questionList').innerHTML='';
    document.getElementById('questionListBox').style.display = 'block';
    document.getElementById('qLabel').innerText = "Question 1";
    document.getElementById('submitBox').style.display = 'block';

     loadQuestions(name);
    renderExams(); //  refresh UI highlight
}

function toggleType(){
    const t = qType.value;

    document.getElementById('mcqOptions').style.display =
        t === 'mcq' ? 'block' : 'none';

    document.getElementById('generalAns').style.display =
        t === 'general' ? 'block' : 'none';

    // reset values
    a.value = b.value = c.value = d.value = '';
    generalAns.value = '';
}
async function addQuestion(){

    if(editingId){

        const q = {
            type: qType.value,
            text: qText.value,
            a: a.value,
            b: b.value,
            c: c.value,
            d: d.value,
            correct: qType.value==='mcq'?correct.value:generalAns.value
        };

        await fetch('/api/update-question', {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                id: editingId,
                question_text: q.text,
                a: q.a,
                b: q.b,
                c: q.c,
                d: q.d,
                correct: q.correct,
                type: q.type
            })
        });

        alert("Question updated!");

        editingId = null;
        loadQuestions(currentExam);
        qText.value = a.value = b.value = c.value = d.value = generalAns.value = '';
        return;
    }

    const q = {
        type: qType.value,
        text: qText.value,
        a: a.value,
        b: b.value,
        c: c.value,
        d: d.value,
        correct: qType.value==='mcq'?correct.value:generalAns.value
    };

    questions.push(q);

    document.getElementById('questionList').innerHTML +=
    `<div class="q-card">
        Question ${qCount}: ${q.text}
        <button onclick="editQuestion(${qCount-1})" style="float:right;">Edit</button>
    </div>`;

    qCount++;
    qLabel.innerText = "Question " + qCount;

    qText.value = a.value = b.value = c.value = d.value = generalAns.value = '';
}
function editQuestion(index){
    const q = questions[index];

    qType.value = q.type;
    toggleType();

    qText.value = q.text;
    a.value = q.a || '';
    b.value = q.b || '';
    c.value = q.c || '';
    d.value = q.d || '';

    if(q.type === 'mcq'){
        correct.value = q.correct;
    } else {
        generalAns.value = q.correct;
    }

    questions.splice(index,1);
    qCount--;
    qLabel.innerText = "Question " + qCount;
}
function editSavedQuestion(q){
    editingId = q.id;

    // set type
    qType.value = q.type;
    toggleType();

    // set question text
    qText.value = q.question_text;

    // set options
 a.value = q.a || '';
b.value = q.b || '';
c.value = q.c || '';
d.value = q.d || '';

    // set correct answer
    if(q.type === 'mcq'){
correct.value = q.correct;
    } else {
generalAns.value = q.correct;
    }

    // scroll to form
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function deleteQuestion(id){

    if(!confirm("Delete this question?")) return;

    const res = await fetch('/api/delete-question', {
        method: 'DELETE',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ id: id })
    });

    const data = await res.json();

    if(data.success){
        alert("Deleted successfully");

        // reload questions + FIX numbering automatically
        loadQuestions(currentExam);

    } else {
        alert("Delete failed");
    }
}

async function submitExam(){

    if(!startTime.value || !endTime.value || !duration.value){
        alert("Please set exam schedule");
        return;
    }

    // 1️⃣ Save schedule
    await fetch('/api/set-schedule', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            subject: currentExam,
            start: startTime.value,
            end: endTime.value,
            timer: duration.value
        })
    });

    // 2️⃣ Save questions
    for(const q of questions){
        await fetch('/api/questions', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                subject: currentExam,
                question_text: q.text,
                a: q.a,
                b: q.b,
                c: q.c,
                d: q.d,
                correct: q.correct,
                type: q.type
            })
        });
    }

    alert("Exam created successfully!");
    location.reload();
}
loadExams();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Question Bank — EduQuiz</title>
  <style>
    .opt-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 6px;
      font-size: 0.88rem;
      transition: var(--transition);
    }
    .opt-row.correct-opt {
      border-color: var(--green);
      background: rgba(63,185,80,0.08);
      color: var(--green);
    }
    .opt-letter {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--surface);
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: var(--mono);
      flex-shrink: 0;
    }
    .correct-opt .opt-letter {
      background: var(--green);
      color: var(--ink);
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a href="admin.html" class="topnav-brand">
    <div class="brand-icon">📚</div>
    <span class="brand-name">Edu<span>Quiz</span></span>
  </a>
  <div class="topnav-right">
    <a href="admin.html" class="btn btn-ghost btn-sm">← Dashboard</a>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container" style="max-width:1300px;">
    <div class="page-title-row">
      <div>
        <div class="page-title">📑 Question <span>Bank</span></div>
        <div class="page-subtitle">Browse all questions by subject.</div>
      </div>
    </div>

    <div class="two-col">
      <!-- Subjects -->
      <div>
        <div class="panel" style="position:sticky;top:80px;">
          <div class="panel-header">
            <div class="panel-header-left">Subjects</div>
            <span class="badge badge-blue" id="subjCount">0</span>
          </div>
          <div style="padding:12px;" id="subjectList">
            <div class="empty-state" style="padding:20px;"><div class="empty-text">Loading...</div></div>
          </div>
        </div>
      </div>

      <!-- Questions -->
      <div>
        <div id="questionArea">
          <div class="panel">
            <div style="padding:48px;text-align:center;color:var(--text-dim);">
              <div style="font-size:40px;margin-bottom:12px;">📑</div>
              <div style="font-weight:600;margin-bottom:4px;">Select a subject</div>
              <div style="font-size:0.85rem;">Choose from the left panel to view questions</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentSubject = '';

async function loadSubjects() {
  const res = await fetch('/api/get-exams');
  const data = await res.json();
  document.getElementById('subjCount').textContent = data.length;

  const box = document.getElementById('subjectList');
  if (!data.length) { box.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-text">No subjects</div></div>'; return; }

  box.innerHTML = data.map(e => `
    <div class="exam-item ${e.subject===currentSubject?'active':''}" onclick="selectSubject('${e.subject}')">
      <div>
        <div class="exam-item-name">📘 ${e.subject}</div>
        <div class="exam-item-meta">${e.qCount} questions</div>
      </div>
    </div>`).join('');
}

async function selectSubject(name) {
  currentSubject = name;
  loadSubjects();

  document.getElementById('questionArea').innerHTML = `<div class="panel"><div style="padding:24px;text-align:center;color:var(--text-muted);">Loading questions...</div></div>`;

  const res = await fetch(`/api/get-questions?subject=${name}`);
  const data = await res.json();

  const area = document.getElementById('questionArea');

  if (!data.length) {
    area.innerHTML = `
      <div class="panel">
        <div class="panel-header"><div class="panel-header-left">📘 ${name}</div></div>
        <div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No questions in this subject</div></div>
      </div>`;
    return;
  }

  area.innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-header-left">📘 ${name}</div>
        <span class="badge badge-blue">${data.length} questions</span>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
        ${data.map((q, i) => {
          const isMCQ = q.type && q.type.toLowerCase().trim() === 'mcq';
          const opts = isMCQ ? ['A','B','C','D'].map(l => {
            const text = q[`option_${l.toLowerCase()}`] || '';
            if (!text) return '';
            const isCorrect = q.correct_option === l;
            return `<div class="opt-row ${isCorrect?'correct-opt':''}">
              <div class="opt-letter">${l}</div>
              <span>${text}</span>
              ${isCorrect ? '<span style="margin-left:auto;font-size:0.72rem;font-weight:700;">✓ CORRECT</span>' : ''}
            </div>`;
          }).join('') : `<div class="opt-row correct-opt"><div class="opt-letter">✓</div><span>${q.correct_option || 'No answer'}</span></div>`;

          return `<div style="background:var(--ink);border:1px solid var(--border);border-radius:12px;padding:16px;">
            <div style="display:flex;gap:10px;margin-bottom:12px;align-items:flex-start;">
              <span class="q-number">Q${i+1}</span>
              <div style="font-weight:600;font-size:0.92rem;line-height:1.5;">${q.question_text}</div>
              <span class="badge ${isMCQ?'badge-blue':'badge-purple'}" style="margin-left:auto;flex-shrink:0;">${isMCQ?'MCQ':'Short'}</span>
            </div>
            ${opts}
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

loadSubjects();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Exam Schedule — EduQuiz</title>
</head>
<body>

<nav class="topnav">
  <a href="home.html" class="topnav-brand">
    <div class="brand-icon">📚</div>
    <span class="brand-name">Edu<span>Quiz</span></span>
  </a>
  <div class="topnav-right">
    <a href="home.html" class="btn btn-ghost btn-sm">← Dashboard</a>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container">
    <div class="page-title-row">
      <div>
        <div class="page-title">📅 Exam <span>Schedule</span></div>
        <div class="page-subtitle">Upcoming and current exam windows.</div>
      </div>
    </div>

    <div class="panel" id="schedulePanel">
      <div class="panel-header"><div class="panel-header-left">Available Schedules</div></div>
      <div id="scheduleList"><div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">Loading...</div></div></div>
    </div>
  </div>
</div>

<script>
async function loadSchedule() {
  const examsRes = await fetch('/api/get-exams');
  const exams = await examsRes.json();

  const container = document.getElementById('scheduleList');
  if (!exams.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No scheduled exams</div></div>';
    return;
  }

  const schedules = await Promise.all(exams.map(async e => {
    const res = await fetch(`/api/get-schedule/${e.subject}`);
    const s = await res.json();
    return { subject: e.subject, schedule: s };
  }));

  const now = new Date();
  container.innerHTML = schedules.map(({subject, schedule}) => {
    if (!schedule) return `
      <div class="activity-row">
        <div class="activity-left">
          <div class="activity-icon-box">📘</div>
          <div>
            <div class="activity-name">${subject}</div>
            <div class="activity-meta">No schedule set</div>
          </div>
        </div>
        <span class="badge badge-red">Unscheduled</span>
      </div>`;

    const start = new Date(schedule.start_time);
    const end = new Date(schedule.end_time);
    const isActive = now >= start && now <= end;
    const isUpcoming = now < start;

    return `
      <div class="activity-row">
        <div class="activity-left">
          <div class="activity-icon-box">📘</div>
          <div>
            <div class="activity-name">${subject}</div>
            <div class="activity-meta">
              ${start.toLocaleString()} — ${end.toLocaleString()} · ${schedule.timer} min
            </div>
          </div>
        </div>
        <span class="badge ${isActive?'badge-green':isUpcoming?'badge-blue':'badge-red'}">
          ${isActive?'🟢 Active':isUpcoming?'🔵 Upcoming':'⚪ Ended'}
        </span>
      </div>`;
  }).join('');
}
loadSchedule();

</script>
</body>
</html>

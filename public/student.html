<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Exam — EduQuiz</title>
  <style>
    .exam-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(13,17,23,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 1000;
    }

    .exam-progress-bar {
      position: fixed;
      top: 64px; left: 0; right: 0;
      height: 3px;
      background: var(--surface);
      z-index: 999;
    }

    .exam-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 0.4s ease;
    }

    .exam-body {
      padding-top: 88px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-bottom: 40px;
    }

    .exam-card {
      width: 700px;
      max-width: 95vw;
      margin-top: 40px;
    }

    .q-panel {
      background: var(--ink-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 16px;
    }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .q-num-badge {
      font-family: var(--mono);
      font-size: 0.78rem;
      background: rgba(88,166,255,0.1);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid rgba(88,166,255,0.2);
    }

    .q-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .answer-input {
      width: 100%;
      background: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      padding: 14px 16px;
      outline: none;
      transition: var(--transition);
    }

    .answer-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88,166,255,0.1);
    }

    .timer-warning { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
  </style>
</head>
<body>

<div class="exam-header">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="brand-icon" style="width:32px;height:32px;font-size:14px;">📚</div>
    <strong id="subTitle" style="font-size:0.95rem;">Exam</strong>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div id="timer" class="timer-chip">00:00</div>
    <span id="progressText" style="font-size:0.82rem;color:var(--text-muted);">Q 1 of —</span>
  </div>
</div>

<div class="exam-progress-bar">
  <div class="exam-progress-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="exam-body">
  <div class="exam-card">
    <div class="q-panel">
      <div class="q-meta">
        <span class="q-num-badge" id="qCount">Q1</span>
        <span style="font-size:0.78rem;color:var(--text-muted);" id="qType">MCQ</span>
      </div>
      <div class="q-text" id="qText">Loading...</div>
    </div>

    <div id="options"></div>

    <div class="action-bar" style="margin-top:8px;">
      <button class="btn btn-ghost" onclick="prev()" id="prevBtn">← Previous</button>
      <div style="display:flex;gap:8px;">
        <button id="next" class="btn btn-primary" onclick="next()" style="display:none;">Next →</button>
        <button id="submit" class="btn btn-success" onclick="finish()" style="display:none;">Submit Exam ✓</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let questions = [], current = 0, score = 0, time = 0, clock;
const sub = localStorage.getItem('selSub');
let answers = {};

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => t.className = '', 3000);
}

async function init() {
  document.getElementById('subTitle').textContent = sub + ' Exam';

  const res = await fetch(`/api/questions/${sub}`);
  questions = await res.json();

  if (!questions || questions.length === 0) {
    alert('No questions found!');
    window.location.href = 'home.html';
    return;
  }

  const schRes = await fetch(`/api/get-schedule/${sub}`);
  const schedule = await schRes.json();

  if (!schedule) { alert('Exam schedule not found!'); window.location.href = 'home.html'; return; }

  const now = new Date();
  const start = new Date(schedule.start_time);
  const end = new Date(schedule.end_time);

  if (now < start) { alert('Exam has not started yet!'); window.location.href = 'home.html'; return; }
  if (now > end) { alert('Exam time is over!'); window.location.href = 'home.html'; return; }

  const remaining = Math.floor((end - now) / 1000);
  time = (schedule.timer && schedule.timer > 0) ? schedule.timer * 60 : remaining;

  startClock();
  show();
}

function startClock() {
  clock = setInterval(() => {
    time--;
    const m = Math.floor(time / 60), s = time % 60;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = `${m}:${s < 10 ? '0'+s : s}`;
    if (time <= 60) timerEl.classList.add('timer-warning');
    if (time <= 0) { time = 0; finish(); }
  }, 1000);
}

function show() {
  const q = questions[current];
  const pct = ((current + 1) / questions.length) * 100;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Q ${current + 1} of ${questions.length}`;
  document.getElementById('qCount').textContent = `Q${current + 1}`;
  document.getElementById('qText').textContent = q.question_text;
  document.getElementById('qType').textContent = (q.type === 'general') ? 'Short Answer' : 'MCQ';

  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';

  if (q.type === 'general') {
    const input = document.createElement('input');
    input.className = 'answer-input';
    input.placeholder = 'Type your answer here...';
    input.value = answers[q.id] || '';
    input.style.marginBottom = '12px';
    input.oninput = () => { answers[q.id] = input.value; toggleButtons(); };
    optDiv.appendChild(input);
  } else {
    ['a','b','c','d'].forEach(letter => {
      const optText = q[`option_${letter}`];
      if (!optText) return;
      const btn = document.createElement('button');
      btn.className = 'option-btn' + (answers[q.id] === letter.toUpperCase() ? ' selected' : '');
      btn.innerHTML = `<strong style="color:var(--accent);margin-right:10px;">${letter.toUpperCase()}.</strong> ${optText}`;
      btn.onclick = (e) => {
        answers[q.id] = letter.toUpperCase();
        document.querySelectorAll('.option-btn').forEach(b => b.className = 'option-btn');
        btn.className = 'option-btn selected';
        toggleButtons();
      };
      optDiv.appendChild(btn);
    });
  }

  document.getElementById('prevBtn').style.opacity = current === 0 ? '0.3' : '1';
  toggleButtons();
}

function toggleButtons() {
  const answered = answers[questions[current].id];
  const isLast = current === questions.length - 1;
  document.getElementById('next').style.display = (answered && !isLast) ? 'flex' : 'none';
  document.getElementById('submit').style.display = (answered && isLast) ? 'flex' : 'none';
}

function next() { current++; show(); }
function prev() { if (current > 0) { current--; show(); } }

async function finish() {
  clearInterval(clock);
  score = 0;
  questions.forEach(q => {
    const ua = answers[q.id];
    if (!ua) return;
    if (q.type === 'general') { if (ua.toLowerCase() === q.correct_option.toLowerCase()) score++; }
    else { if (ua === q.correct_option) score++; }
  });

  await fetch('/api/save-result', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      student_name: localStorage.getItem('userName'),
      student_id: localStorage.getItem('studentID'),
      score, total: questions.length, subject: sub
    })
  });

  const pct = Math.round(score / questions.length * 100);
  alert(`Exam submitted!\nScore: ${score}/${questions.length} (${pct}%)`);
  window.location.href = 'home.html';
}

init();
</script>

</body>
</html>

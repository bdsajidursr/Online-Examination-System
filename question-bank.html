<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Question Bank</title>

<style>
body { margin:0; font-family:Segoe UI; background:#f4f7fb; }

.container { display:flex; padding:0 20px 20px; gap:20px; }

/* LEFT PANEL */
.left {
    width:25%;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.subject {
    padding:12px;
    margin-bottom:10px;
    background:#e2e8f0;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.subject:hover { background:#cbd5f5; }
.subject.active { background:#3b82f6; color:white; }

/* RIGHT PANEL */
.right {
    flex:1;
}

/* TOP BAR (FULL WIDTH SUBJECT) */
.subject-bar {
    width:96%;
    padding:15px 20px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    color:white;
    background: linear-gradient(135deg,#3b82f6,#6366f1);
    margin-bottom:20px;
}

/* QUESTIONS */
.card {
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.q {
    margin-bottom:10px;
    font-weight:600;
}

.opt {
    padding:8px;
    margin:5px 0;
    border-radius:6px;
    background:#f1f5f9;
}
.correct {
    background:#22c55e;
    color:white;
}
.title-bar {
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: 600;
    color: white;
    background: #e55039;   /* 🔴 RED (same as dashboard) */
    margin: 20px;
}
</style>
</head>

<body>
    <div class="title-bar">📑 Question Bank</div>

<div class="container">

<div class="left">
    <h3>Subjects</h3>
    <div id="subjectList"></div>
</div>

<div class="right">
    <div id="subjectTitle" class="subject-bar">Select Subject</div>
    <div id="questionArea"></div>
</div>

</div>

<script>
let subjects = [];
let current = "";

async function loadSubjects(){
    const res = await fetch('/api/get-exams');
    const data = await res.json();

    subjects = data.map(e => e.subject);

    const box = document.getElementById('subjectList');
    box.innerHTML = '';

    subjects.forEach(s=>{
        box.innerHTML += `
        <div class="subject" onclick="selectSubject('${s}')">
            📘 ${s}
        </div>`;
    });
}

async function selectSubject(name){
    current = name;
document.getElementById('subjectTitle').innerHTML = "📘 " + name;

    const res = await fetch('/api/get-questions?subject='+name);
    const data = await res.json();

    const area = document.getElementById('questionArea');
    area.innerHTML = '';

data.forEach(q=>{
    let html = `<div class="card">
        <div class="q">Q: ${q.question_text}</div>`;

    if(q.type && q.type.toLowerCase().trim() === 'mcq'){
        html += `
            <div class="opt ${q.correct_option=='A'?'correct':''}">A. ${q.option_a || ''}</div>
            <div class="opt ${q.correct_option=='B'?'correct':''}">B. ${q.option_b || ''}</div>
            <div class="opt ${q.correct_option=='C'?'correct':''}">C. ${q.option_c || ''}</div>
            <div class="opt ${q.correct_option=='D'?'correct':''}">D. ${q.option_d || ''}</div>
        `;
    } else {
        html += `
            <div class="opt correct">
                Answer: ${q.correct_option || 'No answer'}
            </div>
        `;
    }

    html += `</div>`;
    area.innerHTML += html;
});
}

loadSubjects();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Results Dashboard</title>

<style>
body { margin:0; font-family:Segoe UI; background:#f4f7fb; }

/* HEADER */
.title-bar {
    padding:15px 25px;
    margin:20px;
    border-radius:10px;
    font-size:20px;
    font-weight:600;
    color:white;
    background:#2ecc71;
}

/* CONTAINER */
.container { padding:0 20px 20px; }

/* FILTER */
.filter {
    margin-bottom:15px;
}

select {
    padding:8px;
    border-radius:6px;
}

/* STATS */
.stats-grid {
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:20px;
    margin-bottom:25px;
}

.stat-card {
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
    transition:0.3s;
}
#pagination button:hover {
    background:#27ae60;
    color:white;
    transform: scale(1.05);
}

input:focus {
    outline:none;
    border:1px solid #2ecc71;
}

.stat-card:hover { transform:translateY(-5px); }

.stat-title { color:#777; font-size:14px; }
.stat-value { font-size:24px; font-weight:bold; margin-top:5px; }

/* COLORS */
.green { border-left:5px solid #2ecc71; }
.blue { border-left:5px solid #3498db; }
.orange { border-left:5px solid #f39c12; }
.red { border-left:5px solid #e74c3c; }

/* CARD */
.card {
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
    margin-bottom:20px;
}

/* TABLE */
table { width:100%; border-collapse:collapse; }

th, td {
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;   /* ✅ add this */
}

th {
    background:#f1f5f9;
}

th:nth-child(4), td:nth-child(4) {
    text-align:center;
}
/* TOP STUDENTS */
.top-item {
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #eee;
}

/* PROGRESS BAR */
.bar {
    height:8px;
    background:#eee;
    border-radius:5px;
    overflow:hidden;
    margin-top:5px;
}

.fill {
    min-width: 5%;
    height:100%;
    background:#2ecc71;
}



/* CHART */
.chart-row {
    margin-bottom:10px;
}
tr:hover {
    background:#f9fbff;
}
.card {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
#pagination button:hover {
    transform: scale(1.05);
}
#pagination {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}
</style>
</head>

<body>

<div class="title-bar">📊 Results Dashboard</div>

<div class="container">

<!-- FILTER -->
<div class="filter">
    <label>Filter by Subject:</label>
    <select id="subjectFilter" onchange="applyFilter()">
        <option value="all">All</option>
    </select>
</div>

<!-- STATS -->
<div class="stats-grid">
    <div class="stat-card green">
        <div class="stat-title">Total Students</div>
        <div class="stat-value" id="total">0</div>
    </div>

    <div class="stat-card blue">
        <div class="stat-title">Average Score</div>
        <div class="stat-value" id="avg">0</div>
    </div>

    <div class="stat-card orange">
        <div class="stat-title">Pass Rate</div>
        <div class="stat-value" id="pass">0%</div>
    </div>

    <div class="stat-card red">
        <div class="stat-title">Highest Score</div>
        <div class="stat-value" id="max">0</div>
    </div>
</div>
<div style="margin-bottom:10px;">
    <input type="text" id="searchBox" placeholder="🔍 Search student..."
        style="padding:8px; width:250px; border-radius:6px; border:1px solid #ccc;"
        oninput="searchStudent()">
</div>

<!-- TABLE -->
<div class="card">
    <h3>📋 Student Results</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="table"></tbody>
    </table>
</div>
<div id="pagination" style="margin-top:15px; text-align:center;"></div>


<!-- TOP STUDENTS -->
<div class="card">
    <h3>🏆 Top Performers</h3>
    <div id="top"></div>
</div>

<!-- CHART -->
<div class="card">
    <h3>📈 Score Distribution</h3>
    <div id="chart"></div>
</div>

</div>

<script>

let allData = [];
let filtered = [];
let currentPage = 1;
const rowsPerPage = 6;

async function loadData(){
    const res = await fetch('/api/get-all-results');
    const data = await res.json();

    allData = data;
    filtered = data;

    loadSubjects();
    updateUI();
}

function loadSubjects(){
    const select = document.getElementById('subjectFilter');

    const subjects = [...new Set(allData.map(x=>x.subject))];

    subjects.forEach(s=>{
        select.innerHTML += `<option value="${s}">${s}</option>`;
    });
}

function applyFilter(){
    const val = subjectFilter.value;
    const text = document.getElementById('searchBox').value.toLowerCase();

    filtered = allData.filter(s => {
        const matchSubject = val === 'all' || s.subject === val;
        const matchName = s.student_name.toLowerCase().includes(text);
        return matchSubject && matchName;
    });

    currentPage = 1;
    updateUI();
}

function updateUI(){
    renderTable();
    stats();
    topStudents();
    chart();
}

/* TABLE */

function searchStudent(){
    const text = document.getElementById('searchBox').value.toLowerCase();
    const subjectVal = document.getElementById('subjectFilter').value;

    filtered = allData.filter(s => {
        const matchName = s.student_name.toLowerCase().includes(text);
        const matchSubject = subjectVal === 'all' || s.subject === subjectVal;
        return matchName && matchSubject;
    });

    currentPage = 1;
    updateUI();
}
/* STATS */
function stats(){

    if(filtered.length === 0){
        total.innerText = 0;
        avg.innerText = "0";
        pass.innerText = "0";
        max.innerText = "0";
        return;
    }

    const studentMap = {};

    // ✅ group by student
    filtered.forEach(s => {
    const key = s.student_id;
    const score = Number(s.score);
    const totalMarks = Number(s.total || 100);

    if(!studentMap[key]){
        studentMap[key] = {
            name: s.student_name,  // keep name for display
            totalScore: 0,
            totalMarks: 0
        };
    }

    studentMap[key].totalScore += score;
    studentMap[key].totalMarks += totalMarks;
});

    const students = Object.values(studentMap);
    const totalStudents = students.length;

    let totalScoreSum = 0;
    let totalMarksSum = 0;
    let passCount = 0;

    let highestScore = 0;
    let highestTotal = 0;

    students.forEach(s => {

        totalScoreSum += s.totalScore;
        totalMarksSum += s.totalMarks;

        // pass if >= 50%
        if((s.totalScore / s.totalMarks) >= 0.5){
            passCount++;
        }

        // track highest performer
        if((s.totalScore / s.totalMarks) > (highestScore / (highestTotal || 1))){
            highestScore = s.totalScore;
            highestTotal = s.totalMarks;
        }
    });

    // ✅ average as real marks
    const avgScore = (totalScoreSum / totalStudents).toFixed(1);
    const avgTotal = (totalMarksSum / totalStudents).toFixed(1);

    // ✅ update UI
    document.getElementById('total').innerText = totalStudents;
    document.getElementById('avg').innerText = `${avgScore}/${avgTotal}`;
    document.getElementById('pass').innerText = `${passCount}/${totalStudents}`;
    document.getElementById('max').innerText = `${highestScore}/${highestTotal}`;
}

function renderPagination(){

    const totalPages = Math.ceil(filtered.length / rowsPerPage);
    const container = document.getElementById('pagination');

    container.innerHTML = '';

    for(let i=1;i<=totalPages;i++){
        container.innerHTML += `
        <button onclick="goPage(${i})"
        style="
            margin:3px;
            padding:6px 12px;
            border-radius:6px;
            border:none;
            cursor:pointer;
            font-weight:600;
            background:${i===currentPage ? '#2ecc71' : '#ecf0f1'};
            color:${i===currentPage ? '#fff' : '#333'};
            transition:0.2s;
        ">
        ${i}
        </button>`;
    }
}

function renderTable(){
    const table = document.getElementById('table');

    table.innerHTML = '';

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    const pageData = filtered.slice(start, end);

    if(pageData.length === 0){
        table.innerHTML = `
        <tr>
            <td colspan="3" style="text-align:center; padding:20px; color:#888;">
                No results found
            </td>
        </tr>`;
        renderPagination(); 
        return;
    }

    pageData.forEach(s=>{
        table.innerHTML += `
        <tr>
    <td>${s.student_id}</td>
    <td>${s.student_name}</td>
    <td>${s.subject}</td>
    <td>${s.score}</td>
        </tr>`;
    });

    renderPagination();
}

function goPage(page){
    currentPage = page;
    renderTable();
}

/* TOP STUDENTS */
function topStudents(){

    const topDiv = document.getElementById('top');

    const studentMap = {};

    filtered.forEach(s => {
        const key = s.student_id;

        if(!studentMap[key]){
            studentMap[key] = {
                name: s.student_name,
                totalScore: 0,
                totalMarks: 0
            };
        }

        studentMap[key].totalScore += Number(s.score);
        studentMap[key].totalMarks += Number(s.total || 100);
    });

    const students = Object.values(studentMap)
        .sort((a,b)=> (b.totalScore/b.totalMarks) - (a.totalScore/a.totalMarks))
        .slice(0,5);

    const medals = ["🥇","🥈","🥉","🏅","🏅"];

    topDiv.innerHTML = '';

    students.forEach((s,i)=>{

        const percent = (s.totalScore / s.totalMarks) * 100;

        topDiv.innerHTML += `
        <div class="top-item">
            <div>${medals[i]} ${s.name}</div>
            <div><strong>${s.totalScore}/${s.totalMarks}</strong></div>
        </div>
        <div class="bar">
            <div class="fill" style="width:${percent}%"></div>
        </div>`;
    });
}
/* CHART */
function chart(){

    const chartDiv = document.getElementById('chart');

    const studentMap = {};

    // ✅ GROUP BY ID
    filtered.forEach(s=>{
        const key = s.student_id;

        if(!studentMap[key]){
            studentMap[key] = {
                totalScore: 0,
                totalMarks: 0
            };
        }

        studentMap[key].totalScore += Number(s.score);
        studentMap[key].totalMarks += Number(s.total || 100);
    });

    const students = Object.values(studentMap);

    let ranges = [0,0,0,0,0];

    students.forEach(s=>{
        let percent = (s.totalScore / s.totalMarks) * 100;

        if(percent <= 40) ranges[0]++;
        else if(percent <= 60) ranges[1]++;
        else if(percent <= 75) ranges[2]++;
        else if(percent <= 90) ranges[3]++;
        else ranges[4]++;
    });

    const labels = [
        "❌ Fail (0-40%)",
        "⚠️ Average (41-60%)",
        "👍 Good (61-75%)",
        "💪 Very Good (76-90%)",
        "🏆 Excellent (91-100%)"
    ];

    const maxVal = Math.max(...ranges);

    chartDiv.innerHTML = '';

    ranges.forEach((val,i)=>{

        let percentWidth = maxVal ? (val/maxVal)*100 : 0;

        chartDiv.innerHTML += `
        <div class="chart-row">
            <div style="display:flex; justify-content:space-between;">
                <span>${labels[i]}</span>
                <span>${val} students</span>
            </div>
            <div class="bar">
                <div class="fill" style="width:${percentWidth}%; transition:1s;"></div>
            </div>
        </div>`;
    });
}
loadData();

</script>

</body>
</html>
